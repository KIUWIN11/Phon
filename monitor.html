<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Celestial Monitor</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100vh; background: linear-gradient(160deg,#030c06,#071209,#030c06); font-family: monospace; color: #fff; padding-bottom: 30px; }
.wrap { max-width: 420px; margin: 0 auto; }
.header { display: flex; justify-content: space-between; align-items: center; padding: 20px 16px 12px; }
.app-name { font-size: 19px; font-weight: 800; text-shadow: 0 0 14px rgba(0,255,120,0.5); }
.app-sub { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 3px; }
.badge { width: 42px; height: 42px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; color: #000; }
.banner { margin: 0 16px 12px; border-radius: 16px; height: 160px; background: linear-gradient(135deg,#041208,#0b2010); position: relative; overflow: hidden; cursor: pointer; border: 1px solid rgba(0,255,120,0.2); }
.banner-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,255,100,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,100,0.03) 1px,transparent 1px); background-size: 26px 26px; }
#bannerImg { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; display: none; }
.banner-add { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.banner-add .circle { width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(0,255,120,0.35); display: flex; align-items: center; justify-content: center; font-size: 24px; color: rgba(0,255,120,0.5); }
.banner-add .txt { font-size: 12px; letter-spacing: 1px; color: rgba(0,255,120,0.4); }
.content { padding: 0 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.card { background: rgba(0,255,100,0.04); border: 1px solid rgba(0,255,120,0.13); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }
.lbl { font-size: 10px; font-weight: 700; letter-spacing: 1.8px; display: block; margin-bottom: 6px; }
.big { font-size: 26px; font-weight: 800; }
.mid { font-size: 18px; font-weight: 800; }
.bar-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); margin-top: 10px; overflow: hidden; }
.bar-fill { height: 6px; border-radius: 3px; width: 0%; }
.temp-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.temp-main { font-size: 22px; font-weight: 800; }
.temp-sub { font-size: 11px; font-weight: 700; text-align: right; }
.temp-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.temp-cell { background: rgba(0,255,100,0.04); border-radius: 10px; padding: 8px 10px; border: 1px solid rgba(0,255,120,0.07); }
.temp-cell .sub { font-size: 10px; color: rgba(255,255,255,0.35); margin-bottom: 4px; }
.temp-cell .val { font-size: 15px; font-weight: 700; }
[contenteditable] { outline: none; border-bottom: 1px dashed rgba(0,255,120,0.4); cursor: text; }
[contenteditable]:focus { background: rgba(0,255,100,0.08); border-radius: 4px; padding: 1px 4px; }
#fileInput { display: none; }
#canvas { display: none; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="wrap">
  <div class="header">
    <div>
      <div class="app-name" id="appName" contenteditable="true" style="color:#00ff88">Celestial-Game-Opt</div>
      <div class="app-sub">
        <span contenteditable="true">2.7</span> | <span contenteditable="true" style="color:#00aa44">CORE</span>
      </div>
    </div>
    <div class="badge" id="badge" style="background:linear-gradient(135deg,#00ff88,#009944);box-shadow:0 0 18px rgba(0,255,120,0.35)">Z</div>
  </div>

  <div class="banner" onclick="document.getElementById('fileInput').click()">
    <div class="banner-grid"></div>
    <img id="bannerImg"/>
    <div class="banner-add" id="bannerAdd">
      <div class="circle">+</div>
      <div class="txt">Add image</div>
    </div>
  </div>
  <input type="file" id="fileInput" accept="image/*" onchange="loadImg(event)"/>

  <div class="content">
    <div class="grid2">
      <div class="card">
        <span class="lbl" id="lbl1" style="color:#00cc55">CPU USAGE</span>
        <div class="big"><span id="cpuVal" contenteditable="true" oninput="setTarget('cpu',this.innerText,100)">25</span>%</div>
        <div class="bar-track"><div class="bar-fill" id="cpuFill" style="background:linear-gradient(90deg,#00ff8866,#00ff88);box-shadow:0 0 8px #00ff88"></div></div>
      </div>
      <div class="card">
        <span class="lbl" style="color:#00cc55">RAM AVAILABLE</span>
        <div class="mid">
          <span id="ramUsed" contenteditable="true" oninput="updateRam()">3.3</span> /
          <span id="ramTotal" contenteditable="true" oninput="updateRam()">5.6</span> GB
        </div>
        <div class="bar-track"><div class="bar-fill" id="ramFill" style="background:linear-gradient(90deg,#00bb5566,#00bb55);box-shadow:0 0 8px #00bb55"></div></div>
      </div>
    </div>

    <div class="card">
      <div class="temp-row">
        <span class="lbl" style="color:#00cc55">DEVICE TEMPERATURE</span>
        <div>
          <div class="temp-main"><span contenteditable="true">37.6</span>°C</div>
          <div class="temp-sub" style="color:#00ff88"><span contenteditable="true">Normal</span></div>
        </div>
      </div>
      <div class="temp-grid">
        <div class="temp-cell"><div class="sub">CPU</div><div class="val"><span contenteditable="true">43</span>°C</div></div>
        <div class="temp-cell"><div class="sub">GPU</div><div class="val"><span contenteditable="true">N/A</span></div></div>
        <div class="temp-cell"><div class="sub">Battery</div><div class="val"><span contenteditable="true">37.6</span>°C</div></div>
      </div>
    </div>

    <div class="card"><span class="lbl" style="color:#00cc55">ANDROID SDK</span><div style="font-size:13px;color:#ccc" contenteditable="true">14 (34)</div></div>
    <div class="card"><span class="lbl" style="color:#00cc55">ABIS</span><div style="font-size:13px;color:#ccc;word-break:break-all" contenteditable="true">armeabi-v7a,armeabi</div></div>
    <div class="card"><span class="lbl" style="color:#00cc55">BASEBAND VERSION</span><div style="font-size:13px;color:#ccc;word-break:break-all" contenteditable="true">A135FXXSEEZB1,A135FXXSEEZB1</div></div>
    <div class="card"><span class="lbl" style="color:#00cc55">KERNEL VERSION</span><div style="font-size:13px;color:#ccc;word-break:break-all" contenteditable="true">4.19.198-28701120-abA135FXXSEEZB2</div></div>
  </div>
</div>

<script>
// --- Bar animation ---
const targets = { cpu: 25, ram: 59 };
const current = { cpu: 0, ram: 0 };

function animLoop() {
  ['cpu','ram'].forEach(k => {
    const diff = targets[k] - current[k];
    if (Math.abs(diff) > 0.05) {
      current[k] += diff * 0.07;
      const el = document.getElementById(k + 'Fill');
      if (el) el.style.width = current[k] + '%';
    }
  });
  requestAnimationFrame(animLoop);
}
animLoop();

function setTarget(k, val, max) {
  targets[k] = Math.min(100, Math.max(0, parseFloat(val) / max * 100)) || 0;
}
function updateRam() {
  const u = parseFloat(document.getElementById('ramUsed').innerText) || 0;
  const t = parseFloat(document.getElementById('ramTotal').innerText) || 1;
  targets.ram = Math.min(100, u / t * 100);
}

// --- Image + color extraction ---
function loadImg(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = document.getElementById('bannerImg');
    img.onload = () => {
      document.getElementById('bannerAdd').style.display = 'none';
      extractAndApply(img);
    };
    img.src = ev.target.result;
    img.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function extractAndApply(img) {
  const cv = document.getElementById('canvas');
  const ctx = cv.getContext('2d');
  cv.width = 80; cv.height = 80;
  ctx.drawImage(img, 0, 0, 80, 80);
  const data = ctx.getImageData(0, 0, 80, 80).data;
  let r=0,g=0,b=0,n=0;
  for (let i=0;i<data.length;i+=4) {
    const br=(data[i]+data[i+1]+data[i+2])/3;
    if (br<30||br>220) continue;
    r+=data[i]; g+=data[i+1]; b+=data[i+2]; n++;
  }
  if (!n) return;
  r=Math.round(r/n); g=Math.round(g/n); b=Math.round(b/n);

  // boost
  const mx=Math.max(r,g,b)||1;
  const f=220/mx;
  r=Math.min(255,Math.round(r*f));
  g=Math.min(255,Math.round(g*f));
  b=Math.min(255,Math.round(b*f));

  const c    = `rgb(${r},${g},${b})`;
  const cd   = `rgb(${Math.round(r*.5)},${Math.round(g*.5)},${Math.round(b*.5)})`;
  const cm   = `rgb(${Math.round(r*.75)},${Math.round(g*.75)},${Math.round(b*.75)})`;
  const bg1  = `rgb(${Math.round(r*.04)},${Math.round(g*.04)},${Math.round(b*.04)})`;
  const bg2  = `rgb(${Math.round(r*.07)},${Math.round(g*.07)},${Math.round(b*.07)})`;

  // apply
  document.body.style.background = `linear-gradient(160deg,${bg1},${bg2},${bg1})`;
  document.getElementById('appName').style.color = c;
  document.getElementById('appName').style.textShadow = `0 0 14px ${c}88`;
  document.getElementById('badge').style.background = `linear-gradient(135deg,${c},${cd})`;
  document.getElementById('badge').style.boxShadow = `0 0 18px ${c}66`;

  document.querySelectorAll('.lbl').forEach(el => el.style.color = cm);
  document.querySelectorAll('.temp-sub').forEach(el => el.style.color = c);

  const cpuFill = document.getElementById('cpuFill');
  cpuFill.style.background = `linear-gradient(90deg,${c}44,${c})`;
  cpuFill.style.boxShadow = `0 0 8px ${c}`;

  const ramFill = document.getElementById('ramFill');
  ramFill.style.background = `linear-gradient(90deg,${cd}88,${cm})`;
  ramFill.style.boxShadow = `0 0 8px ${cm}`;
}
</script>
</body>
</html>
