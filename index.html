<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Celestial Monitor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: linear-gradient(160deg,#030c06,#071209,#030c06); font-family: monospace; color: #fff; padding-bottom: 30px; }
  .wrap { max-width: 420px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 16px 12px; }
  .app-name { font-size: 19px; font-weight: 800; color: #00ff88; text-shadow: 0 0 14px rgba(0,255,120,0.5); }
  .app-sub { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 3px; }
  .app-sub span { color: #00aa44; }
  .badge { width: 42px; height: 42px; border-radius: 11px; background: linear-gradient(135deg,#00ff88,#009944); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; color: #000; box-shadow: 0 0 18px rgba(0,255,120,0.35); }
  .banner { margin: 0 16px 12px; border-radius: 16px; height: 160px; background: linear-gradient(135deg,#041208,#0b2010); border: 1px solid rgba(0,255,120,0.18); position: relative; overflow: hidden; cursor: pointer; }
  .banner-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,255,100,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,100,0.03) 1px,transparent 1px); background-size: 26px 26px; }
  .banner img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; z-index: 1; }
  .banner-add { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  .banner-add .circle { width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(0,255,120,0.35); display: flex; align-items: center; justify-content: center; font-size: 24px; color: rgba(0,255,120,0.5); }
  .banner-add .txt { color: rgba(0,255,120,0.4); font-size: 12px; letter-spacing: 1px; }
  .banner-change { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.65); border: 1px solid rgba(0,255,120,0.35); border-radius: 8px; padding: 4px 12px; color: #00ff88; font-size: 11px; font-weight: 700; z-index: 3; display: none; }
  .content { padding: 0 16px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .card { background: rgba(0,255,100,0.04); border: 1px solid rgba(0,255,120,0.13); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }
  .lbl { color: #00cc55; font-size: 10px; font-weight: 700; letter-spacing: 1.8px; display: block; margin-bottom: 6px; }
  .big { font-size: 26px; font-weight: 800; }
  .mid { font-size: 18px; font-weight: 800; }
  .bar-wrap { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.07); margin-top: 10px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
  .temp-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .temp-main { font-size: 22px; font-weight: 800; }
  .temp-status { color: #00ff88; font-size: 11px; font-weight: 700; text-align: right; }
  .temp-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .temp-cell { background: rgba(0,255,100,0.04); border-radius: 10px; padding: 8px 10px; border: 1px solid rgba(0,255,120,0.07); }
  .temp-cell .sub { font-size: 10px; color: rgba(255,255,255,0.35); margin-bottom: 4px; }
  .temp-cell .val { font-size: 15px; font-weight: 700; }
  [contenteditable] { outline: none; border-bottom: 1px dashed rgba(0,255,120,0.4); cursor: text; display: inline; }
  [contenteditable]:focus { background: rgba(0,255,100,0.08); border-radius: 4px; padding: 1px 4px; }
  #fileInput { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <div class="app-name" contenteditable="true">Celestial-Game-Opt</div>
      <div class="app-sub">
        <span id="ver" contenteditable="true">2.7</span> | <span contenteditable="true">CORE</span>
      </div>
    </div>
    <div class="badge">Z</div>
  </div>

  <div class="banner" onclick="document.getElementById('fileInput').click()">
    <div class="banner-grid"></div>
    <img id="bannerImg" style="display:none"/>
    <div class="banner-add" id="bannerAdd">
      <div class="circle">+</div>
      <div class="txt">Thêm ảnh</div>
    </div>
    <div class="banner-change" id="bannerChange">Đổi ảnh</div>
  </div>
  <input type="file" id="fileInput" accept="image/*" onchange="loadImg(event)"/>

  <div class="content">
    <div class="grid2">
      <div class="card">
        <span class="lbl">CPU USAGE</span>
        <div class="big"><span id="cpuVal" contenteditable="true" oninput="updateBar('cpuBar',this.innerText,100,'#00ff88')">25</span>%</div>
        <div class="bar-wrap"><div class="bar-fill" id="cpuBar" style="width:25%;background:linear-gradient(90deg,#00ff8866,#00ff88);box-shadow:0 0 10px #00ff88"></div></div>
      </div>
      <div class="card">
        <span class="lbl">RAM AVAILABLE</span>
        <div class="mid">
          <span id="ramUsed" contenteditable="true" oninput="updateRamBar()">3.3</span> /
          <span id="ramTotal" contenteditable="true" oninput="updateRamBar()">5.6</span> GB
        </div>
        <div class="bar-wrap"><div class="bar-fill" id="ramBar" style="width:59%;background:linear-gradient(90deg,#00bb5566,#00bb55);box-shadow:0 0 10px #00bb55"></div></div>
      </div>
    </div>

    <div class="card">
      <div class="temp-row">
        <span class="lbl">DEVICE TEMPERATURE</span>
        <div>
          <div class="temp-main"><span contenteditable="true">37.6</span>°C</div>
          <div class="temp-status"><span contenteditable="true">Normal</span></div>
        </div>
      </div>
      <div class="temp-grid">
        <div class="temp-cell"><div class="sub">CPU</div><div class="val"><span contenteditable="true">43</span>°C</div></div>
        <div class="temp-cell"><div class="sub">GPU</div><div class="val"><span contenteditable="true">N/A</span></div></div>
        <div class="temp-cell"><div class="sub">Battery</div><div class="val"><span contenteditable="true">37.6</span>°C</div></div>
      </div>
    </div>

    <div class="card"><span class="lbl">ANDROID SDK</span><div style="font-size:13px;color:#ccc" contenteditable="true">14 (34)</div></div>
    <div class="card"><span class="lbl">ABIS</span><div style="font-size:13px;color:#ccc;word-break:break-all" contenteditable="true">armeabi-v7a,armeabi</div></div>
    <div class="card"><span class="lbl">BASEBAND VERSION</span><div style="font-size:13px;color:#ccc;word-break:break-all" contenteditable="true">A135FXXSEEZB1,A135FXXSEEZB1</div></div>
    <div class="card"><span class="lbl">KERNEL VERSION</span><div style="font-size:13px;color:#ccc;word-break:break-all" contenteditable="true">4.19.198-28701120-abA135FXXSEEZB2</div></div>
  </div>
</div>

<script>
function updateBar(id, val, max, color) {
  const pct = Math.min(100, Math.max(0, parseFloat(val)/max*100)) || 0;
  document.getElementById(id).style.width = pct + '%';
}
function updateRamBar() {
  const used = parseFloat(document.getElementById('ramUsed').innerText) || 0;
  const total = parseFloat(document.getElementById('ramTotal').innerText) || 1;
  document.getElementById('ramBar').style.width = Math.min(100, used/total*100) + '%';
}
function loadImg(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = document.getElementById('bannerImg');
    img.src = ev.target.result;
    img.style.display = 'block';
    document.getElementById('bannerAdd').style.display = 'none';
    document.getElementById('bannerChange').style.display = 'block';
  };
  reader.readAsDataURL(file);
}
</script>
</body>
</html>
