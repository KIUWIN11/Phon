<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Celestial Monitor</title>
<style>
:root {
  --c:  #00ff88;
  --cm: #00cc55;
  --cd: #009944;
  --bg1: #030c06;
  --bg2: #071209;
}
* { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.7s, color 0.7s, box-shadow 0.7s, border-color 0.7s, text-shadow 0.7s; }
body { min-height: 100vh; background: linear-gradient(160deg,var(--bg1),var(--bg2),var(--bg1)); font-family: monospace; color: #fff; padding-bottom: 30px; }
.wrap { max-width: 420px; margin: 0 auto; }
.header { display: flex; justify-content: space-between; align-items: center; padding: 20px 16px 12px; }
.app-name { font-size: 19px; font-weight: 800; color: var(--c); text-shadow: 0 0 14px var(--c); }
.app-sub { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 3px; }
.app-sub .tag { color: var(--cm); }
.badge { width: 42px; height: 42px; border-radius: 11px; background: linear-gradient(135deg,var(--c),var(--cd)); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; color: #000; box-shadow: 0 0 18px var(--cd); }
.banner { margin: 0 16px 12px; border-radius: 16px; height: 160px; background: linear-gradient(135deg,var(--bg1),var(--bg2)); border: 1px solid var(--cd); position: relative; overflow: hidden; cursor: pointer; }
.banner-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px); background-size: 26px 26px; }
#bannerImg { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; display: none; }
.banner-add { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.banner-add .circle { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--cm); display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--cm); }
.banner-add .txt { font-size: 12px; letter-spacing: 1px; color: var(--cm); opacity: 0.6; }
.content { padding: 0 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.card { background: rgba(128,128,128,0.05); border: 1px solid rgba(128,128,128,0.1); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }
.lbl { font-size: 10px; font-weight: 700; letter-spacing: 1.8px; display: block; margin-bottom: 6px; color: var(--cm); }
.big { font-size: 26px; font-weight: 800; }
.mid { font-size: 18px; font-weight: 800; }
.bar-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); margin-top: 10px; overflow: hidden; }
.bar-fill { height: 6px; border-radius: 3px; width: 0%; background: linear-gradient(90deg,var(--cd),var(--c)); box-shadow: 0 0 8px var(--c); }
.temp-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.temp-main { font-size: 22px; font-weight: 800; }
.temp-ok { font-size: 11px; font-weight: 700; text-align: right; color: var(--c); }
.temp-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.temp-cell { background: rgba(128,128,128,0.04); border-radius: 10px; padding: 8px 10px; border: 1px solid rgba(128,128,128,0.07); }
.temp-cell .sub { font-size: 10px; color: rgba(255,255,255,0.35); margin-bottom: 4px; }
.temp-cell .val { font-size: 15px; font-weight: 700; }
.info-val { font-size: 13px; color: #ccc; word-break: break-all; }
[contenteditable] { outline: none; border-bottom: 1px dashed var(--cm); cursor: text; }
[contenteditable]:focus { background: rgba(255,255,255,0.06); border-radius: 4px; padding: 1px 4px; }
#fileInput,#canvas { display: none; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="wrap">
  <div class="header">
    <div>
      <div class="app-name" contenteditable="true">Celestial-Game-Opt</div>
      <div class="app-sub">
        <span contenteditable="true">2.7</span> | <span class="tag" contenteditable="true">CORE</span>
      </div>
    </div>
    <div class="badge">Z</div>
  </div>

  <div class="banner" onclick="document.getElementById('fileInput').click()">
    <div class="banner-grid"></div>
    <img id="bannerImg"/>
    <div class="banner-add" id="bannerAdd">
      <div class="circle">+</div>
      <div class="txt">Add image</div>
    </div>
  </div>
  <input type="file" id="fileInput" accept="image/*" onchange="loadImg(event)"/>

  <div class="content">
    <div class="grid2">
      <div class="card">
        <span class="lbl">CPU USAGE</span>
        <div class="big"><span contenteditable="true" oninput="setTarget('cpu',this.innerText,100)">25</span>%</div>
        <div class="bar-track"><div class="bar-fill" id="cpuFill"></div></div>
      </div>
      <div class="card">
        <span class="lbl">RAM AVAILABLE</span>
        <div class="mid">
          <span id="ramUsed" contenteditable="true" oninput="updateRam()">3.3</span> /
          <span id="ramTotal" contenteditable="true" oninput="updateRam()">5.6</span> GB
        </div>
        <div class="bar-track"><div class="bar-fill" id="ramFill"></div></div>
      </div>
    </div>

    <div class="card">
      <div class="temp-row">
        <span class="lbl">DEVICE TEMPERATURE</span>
        <div>
          <div class="temp-main"><span contenteditable="true">37.6</span>°C</div>
          <div class="temp-ok"><span contenteditable="true">Normal</span></div>
        </div>
      </div>
      <div class="temp-grid">
        <div class="temp-cell"><div class="sub">CPU</div><div class="val"><span contenteditable="true">43</span>°C</div></div>
        <div class="temp-cell"><div class="sub">GPU</div><div class="val"><span contenteditable="true">N/A</span></div></div>
        <div class="temp-cell"><div class="sub">Battery</div><div class="val"><span contenteditable="true">37.6</span>°C</div></div>
      </div>
    </div>

    <div class="card"><span class="lbl">ANDROID SDK</span><div class="info-val" contenteditable="true">14 (34)</div></div>
    <div class="card"><span class="lbl">ABIS</span><div class="info-val" contenteditable="true">armeabi-v7a,armeabi</div></div>
    <div class="card"><span class="lbl">BASEBAND VERSION</span><div class="info-val" contenteditable="true">A135FXXSEEZB1,A135FXXSEEZB1</div></div>
    <div class="card"><span class="lbl">KERNEL VERSION</span><div class="info-val" contenteditable="true">4.19.198-28701120-abA135FXXSEEZB2</div></div>
  </div>
</div>

<script>
const targets = { cpu: 25, ram: 59 };
const current = { cpu: 0, ram: 0 };

function loop() {
  ['cpu','ram'].forEach(k => {
    const diff = targets[k] - current[k];
    if (Math.abs(diff) > 0.05) {
      current[k] += diff * 0.07;
      document.getElementById(k + 'Fill').style.width = current[k] + '%';
    }
  });
  requestAnimationFrame(loop);
}
loop();

function setTarget(k, val, max) {
  targets[k] = Math.min(100, Math.max(0, parseFloat(val)/max*100)) || 0;
}
function updateRam() {
  const u = parseFloat(document.getElementById('ramUsed').innerText) || 0;
  const t = parseFloat(document.getElementById('ramTotal').innerText) || 1;
  targets.ram = Math.min(100, u/t*100);
}

function loadImg(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = document.getElementById('bannerImg');
    img.onload = () => {
      document.getElementById('bannerAdd').style.display = 'none';
      applyColor(img);
    };
    img.src = ev.target.result;
    img.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function applyColor(img) {
  const cv = document.getElementById('canvas');
  const ctx = cv.getContext('2d');
  cv.width = 80; cv.height = 80;
  ctx.drawImage(img, 0, 0, 80, 80);
  const px = ctx.getImageData(0,0,80,80).data;
  let r=0,g=0,b=0,n=0;
  for (let i=0;i<px.length;i+=4) {
    const br=(px[i]+px[i+1]+px[i+2])/3;
    if (br<25||br>225) continue;
    r+=px[i]; g+=px[i+1]; b+=px[i+2]; n++;
  }
  if (!n) return;
  r=Math.round(r/n); g=Math.round(g/n); b=Math.round(b/n);
  const mx=Math.max(r,g,b)||1;
  const f=230/mx;
  r=Math.min(255,Math.round(r*f));
  g=Math.min(255,Math.round(g*f));
  b=Math.min(255,Math.round(b*f));

  const root = document.documentElement;
  root.style.setProperty('--c',  `rgb(${r},${g},${b})`);
  root.style.setProperty('--cm', `rgb(${Math.round(r*.75)},${Math.round(g*.75)},${Math.round(b*.75)})`);
  root.style.setProperty('--cd', `rgb(${Math.round(r*.45)},${Math.round(g*.45)},${Math.round(b*.45)})`);
  root.style.setProperty('--bg1',`rgb(${Math.round(r*.03)},${Math.round(g*.03)},${Math.round(b*.03)})`);
  root.style.setProperty('--bg2',`rgb(${Math.round(r*.06)},${Math.round(g*.06)},${Math.round(b*.06)})`);
}
</script>
</body>
</html>
